# SPDX-License-Identifier: MIT
# Thin caller: all CI logic lives in dl9pf-agl/agl-ci, pinned here by full commit SHA (bumped by Dependabot).
name: ci
on:
  pull_request:
  schedule:
    - cron: '17 1 * * *'   # nightly on the default branch, 01:17 UTC
  workflow_dispatch:
    inputs:
      tier:
        description: 'Matrix tier to build'
        type: choice
        options: [push-pr, nightly, release, dispatch]
        default: dispatch

permissions:
  contents: read

jobs:
  ci:
    uses: dl9pf-agl/agl-ci/.github/workflows/layer-ci.yml@edb0a7ebdee665a50075079cb6b79f1a3362bd62 # main (agl-ci PR #17)
    with:
      repo: meta-agl
      tier: ${{ inputs.tier }}
