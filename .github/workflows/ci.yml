# SPDX-License-Identifier: MIT
# Thin caller: all CI logic lives in dl9pf-agl/agl-ci, pinned here by full commit SHA (bumped by Dependabot).
name: ci
on:
  pull_request:
  schedule:
    - cron: '17 1 * * *'   # nightly on the default branch, 01:17 UTC
  workflow_dispatch:
    inputs:
      tier:
        description: 'Matrix tier to build'
        type: choice
        options: [push-pr, nightly, release, dispatch]
        default: dispatch
      mode:
        description: 'build = validate + build; drill = offline fetchall (outage drill)'
        type: choice
        options: [build, drill]
        default: build

permissions:
  contents: read

jobs:
  ci:
    uses: dl9pf-agl/agl-ci/.github/workflows/layer-ci.yml@ad32aa64f6c48396ba200f12fa7f5ff4e198134a # main (agl-ci PR #25)
    with:
      repo: meta-agl
      tier: ${{ inputs.tier }}
      mode: ${{ inputs.mode || 'build' }}
