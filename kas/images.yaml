# SPDX-License-Identifier: MIT
# target: [feature, feature, ...] - bitbake targets this repo's own recipes provide, and which
# aglsetup.sh features (kas/feature/<name>.yml) each one needs on top of base+machine. Not
# machine-gated here (that's CI-matrix/ci/build-matrix.yaml territory, out of scope for this
# file) - every target is buildable on any machine kas/machine/*.yml supports, same as a bare
# `bitbake <target>` always was. Queried by agl-ucb/scripts/aglsetup.sh --list-targets.
agl-image-minimal: []
agl-image-flutter: [agl-flutter]
agl-image-flutter-debug: [agl-flutter]
