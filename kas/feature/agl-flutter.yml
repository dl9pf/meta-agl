header:
  version: 22
  includes:
    - kas/feature/agl-pipewire.yml
    - kas/feature/agl-app-framework.yml

repos:
  meta-agl:
    layers:
      meta-agl-flutter:
  meta-flutter:
    url: https://github.com/meta-flutter/meta-flutter
    path: external/meta-flutter
    branch: master
    layers:
      "":
      meta-flutter-apps:
  meta-openembedded:
    layers:
      meta-multimedia:
      meta-python:

local_conf_header:
  agl-flutter: |
    TOOLCHAIN_HOST_TASK:append = " nativesdk-flutter-sdk"
    require conf/include/agl-flutter.inc
